<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Applications</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fa; }
    h2 { text-align: center; }
    #filter { margin: 10px auto; display: block; width: 200px; }
    .dashboard { display: flex; gap: 16px; justify-content: center; margin-top: 20px; }
    .column { background: #fff; padding: 10px; border-radius: 8px; min-width: 200px; flex: 1; }
    .column h3 { text-align: center; margin-bottom: 8px; }
    .job { background: #dee8ff; margin: 8px 0; padding: 8px; border-radius: 6px; cursor: grab; }
    .dragging { opacity: 0.5; }
  </style>
</head>
<body>

<h2>My Applications</h2>
  <div id="filters" style="max-width:900px;margin:0 auto 10px;display:flex;flex-wrap:wrap;gap:8px;">
  <input id="searchText" type="text" placeholder="Search title/company…" oninput="renderJobs()">
  <input id="locationFilter" type="text" placeholder="Location" oninput="renderJobs()">
  <input id="industryFilter" type="text" placeholder="Industry" oninput="renderJobs()">
  <input id="profileFilter" type="text" placeholder="Profile/Role" oninput="renderJobs()">
  <input id="companyFilter" type="text" placeholder="Company" oninput="renderJobs()">
  <input id="dateFrom" type="date" onchange="renderJobs()">
  <input id="dateTo" type="date" onchange="renderJobs()">
  <!-- Resume upload (local only for now) -->
  <label style="font-size:12px;">
    Attach resume (for this session):
    <input id="resumeInput" type="file" accept=".pdf,.doc,.docx">
  </label>
</div>
<input id="filter" type="text" placeholder="Search jobs..." />

<div class="dashboard">
  <div class="column" data-status="Applied">
    <h3>Applied</h3>
  </div>
  <div class="column" data-status="Interviews">
    <h3>Interviews</h3>
  </div>
  <div class="column" data-status="Offers">
    <h3>Offers</h3>
  </div>
  <div class="column" data-status="Rejected">
    <h3>Rejected</h3>
  </div>
</div>

<script>
const jobs = [
  {
    id: 1,
    title: "Remote Software Developer",
    profile: "Software Developer",
    company: "Tech Innovators",
    location: "Remote / Bangalore",
    industry: "IT",
    datePosted: "2025-11-20", // YYYY-MM-DD
    url: "https://example.com/job1",
    resumeUrl: "" ,
    status: "Applied"
  },
  {
    id: 2,
    title: "Frontend Engineer (React)",
    profile: "Frontend Engineer",
    company: "Creative Apps",
    location: "Remote / Delhi",
    industry: "IT",
    datePosted: "2025-11-18",
    url: "https://example.com/job2",
    resumeUrl: "",
    status: "Applied"
  },
  {
    id: 3,
    title: "QA Analyst",
    profile: "QA Analyst",
    company: "Dev Corp",
    location: "Mumbai",
    industry: "IT Services",
    datePosted: "2025-11-10",
    url: "https://example.com/job3",
    resumeUrl: "",
    status: "Interviews"
  }
];
// Render jobs by status
function renderJobs() {
  // reset column headers
  document.querySelectorAll('.column').forEach(col => {
    col.innerHTML = `<h3>${col.getAttribute('data-status')}</h3>`;
  });

  const q       = document.getElementById('searchText')?.value.toLowerCase() || "";
  const loc     = document.getElementById('locationFilter')?.value.toLowerCase() || "";
  const ind     = document.getElementById('industryFilter')?.value.toLowerCase() || "";
  const prof    = document.getElementById('profileFilter')?.value.toLowerCase() || "";
  const comp    = document.getElementById('companyFilter')?.value.toLowerCase() || "";
  const fromVal = document.getElementById('dateFrom')?.value || "";
  const toVal   = document.getElementById('dateTo')?.value || "";

  jobs
    .filter(job => {
      const txt = (job.title + " " + job.company).toLowerCase();
      if (q && !txt.includes(q)) return false;
      if (loc && !(job.location || "").toLowerCase().includes(loc)) return false;
      if (ind && !(job.industry || "").toLowerCase().includes(ind)) return false;
      if (prof && !(job.profile || "").toLowerCase().includes(prof)) return false;
      if (comp && !(job.company || "").toLowerCase().includes(comp)) return false;

      if (fromVal && job.datePosted < fromVal) return false;
      if (toVal && job.datePosted > toVal) return false;

      return true;
    })
    .forEach(job => {
      const div  = document.createElement('div');
      div.className = 'job';
      div.draggable = true;
      div.dataset.id = job.id;

      const link = document.createElement('a');
      link.href   = job.url;
      link.target = "_blank";
      link.textContent = `${job.title} @ ${job.company} (${job.location})`;

      div.appendChild(link);
      document
        .querySelector(`.column[data-status="${job.status}"]`)
        .appendChild(div);
    });
}
renderJobs();

// Drag and drop logic
let dragged = null;
document.addEventListener('dragstart', e => {
  if (e.target.classList.contains('job')) {
    dragged = e.target;
    setTimeout(() => e.target.classList.add('dragging'), 0);
  }
});
document.addEventListener('dragend', e => {
  if (dragged) {
    dragged.classList.remove('dragging');
    dragged = null;
  }
});
document.querySelectorAll('.column').forEach(col => {
  col.addEventListener('dragover', e => e.preventDefault());
  col.addEventListener('drop', e => {
    if (dragged) {
      const status = col.getAttribute('data-status');
      const jobId = parseInt(dragged.dataset.id);
      jobs.find(j=>j.id === jobId).status = status;
      renderJobs();
    }
  });
});

// Filter/search logic
document.getElementById('filter').addEventListener('input', renderJobs);
</script>
</body>
</html>
